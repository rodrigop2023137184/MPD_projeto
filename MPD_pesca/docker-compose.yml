services:
  mysql:
    image: mysql:8.4
    container_name: MPD_pesca
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sta_princesa
      MYSQL_USER: aluno
      MYSQL_PASSWORD: mysql
    ports:
      - "3307:3306"
    volumes:
      - mysql-pesca-data:/var/lib/mysql

volumes:
  mysql-pesca-data: